name: Exención personal a $5,000 / $10,000
name_en: Personal exemption to $5,000 / $10,000
description: >-
  La exención personal (Sección 1033.18) sube de $3,500 a $5,000 en planilla
  individual y de $7,000 a $10,000 en planilla conjunta.
