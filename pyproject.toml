[project]
name = "policyengine-pr"
version = "0.1.0"
description = "Microsimulation model of Puerto Rico's tax-benefit system."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "policyengine_core>=3.23.6",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff>=0.9.0",
]
app = [
    "streamlit>=1.40",
    "plotly>=5.20,<6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["policyengine_pr"]

[tool.ruff]
line-length = 79
