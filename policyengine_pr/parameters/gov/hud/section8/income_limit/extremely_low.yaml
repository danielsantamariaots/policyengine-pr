description: Extremely low income limit (30% of area median income, floored at the poverty guideline); reported for the 75% targeting rule, by HUD income-limit area (hud_area) and household size, FY2025.
metadata:
  unit: currency-USD
  period: year
  label: Section 8 extremely low income limit by area
  reference:
    - title: "HUD, FY2025 HOME Program Income Limits, State of Puerto Rico, '30% LIMITS' rows for every income-limit area (effective 1 April 2025, dated 2025-01-01 so the 2025 tax year uses them)"
      href: https://www.hudexchange.info/resource/reportmanage/manage/?filter_Year=2025&filter_Scope=State&filter_State=PR&group=IncomeLmts&program=HOME
    - title: "24 CFR 982.201(b)(1): initial eligibility limited to very low-income families (75% of admissions reserved for extremely low-income families)"
      href: https://www.ecfr.gov/current/title-24/subtitle-B/chapter-IX/part-982
  gap: Households larger than 8 use the size-8 value (HUD adds 8% of the four-person limit per extra person).
