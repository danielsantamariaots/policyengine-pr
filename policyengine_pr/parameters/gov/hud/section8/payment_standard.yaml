description: Monthly voucher payment standard by HUD FMR area (hud_area) and number of bedrooms, equal to the FY2025 Fair Market Rent (0 = efficiency, 1-5 bedrooms).
metadata:
  unit: currency-USD
  period: month
  label: Section 8 payment standard by area and bedrooms
  reference:
    - title: "HUD, FY2025 Fair Market Rent Documentation System, one page per Puerto Rico municipio: FMRs by bedroom and the municipios each FMR area consists of (read 4 Nov 2026; exception areas for income limits use their FMR area's rents: Adjuntas -> Ponce, Lares-Utuado -> Aguadilla-Isabela, Las Marías -> Mayagüez)"
      href: https://www.huduser.gov/portal/datasets/fmr/fmrs/FY2025_code/2025summary.odn?fips=7212799999&year=2025&selection_type=county&data=2025
    - title: "HUD, FY2025 HOME Program Rents, State of Puerto Rico, 'FAIR MARKET RENT' rows (five-bedroom values)"
      href: https://www.hudexchange.info/resource/reportmanage/manage/?filter_Year=2025&filter_Scope=State&filter_State=PR&group=RentLimits&program=HOME
    - title: "24 CFR 982.503(b): the PHA sets a payment standard between 90% and 110% of the FMR for each bedroom size"
      href: https://www.ecfr.gov/current/title-24/subtitle-B/chapter-IX/part-982
    - title: "PRPHA, Housing Choice Voucher Program Administrative Plan (June 20, 2025), Sec. VI.A: payment standards set annually between 90% and 110% of the FMR"
      href: https://docs.pr.gov/files/Vivienda/avp.pr.gov/Reglamentaci%C3%B3n/PRPHA_Administrative_Plan_SECTION_8_AMENDMENT_JUNE%20_2025.pdf
  gap: The dollar schedule PRPHA adopts within the 90-110% band is not published; 100% of the FMR is used.
