description: Monthly voucher payment standard by number of bedrooms, set equal to the FY2025 Fair Market Rent for the San Juan-Guaynabo HUD Metro FMR Area.
metadata:
  unit: currency-USD
  period: month
  label: Section 8 payment standard by bedrooms
  reference:
    - title: "HUD, FY2025 HOME Program Rents, State of Puerto Rico, San Juan-Guaynabo, PR HUD Metro FMR Area, 'For Information Only: FAIR MARKET RENT' row (efficiency $552, 1 BR $569, 2 BR $656, 3 BR $861, 4 BR $1,033, 5 BR $1,188)"
      href: https://www.hudexchange.info/resource/reportmanage/manage/?filter_Year=2025&filter_Scope=State&filter_State=PR&group=RentLimits&program=HOME
    - title: "24 CFR 982.503(b): the PHA sets a payment standard between 90% and 110% of the FMR for each bedroom size"
      href: https://www.ecfr.gov/current/title-24/subtitle-B/chapter-IX/part-982
    - title: "PRPHA, Housing Choice Voucher Program Administrative Plan (June 20, 2025), Sec. VI.A: payment standards set annually between 90% and 110% of the FMR, within three months of HUD's FMR publication; hold-harmless on FMR decreases"
      href: https://docs.pr.gov/files/Vivienda/avp.pr.gov/Reglamentaci%C3%B3n/PRPHA_Administrative_Plan_SECTION_8_AMENDMENT_JUNE%20_2025.pdf
  gap: >-
    HUD values effective 1 April 2025, dated 2025-01-01 so the 2025 tax year uses them.
    The Administrative Plan states the 90-110% band but not the dollar schedule
    adopted for FY2025 by area and bedroom size; 100% of the San Juan-Guaynabo
    FMR is used for every area until PRPHA provides it.
