  gap: >-
    Only the October 2021 table is published for sizes 2-18. Later changes are
    documented for a one-person household only (ADSEF statement; August 2024
    press release). Sizes 2-18 keep the 2021 values until ADSEF provides the
    current Tabla. Households larger than 18 use the size-18 value.
