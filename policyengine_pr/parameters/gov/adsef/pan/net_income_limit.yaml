      href: https://serviciosenlinea.adsef.pr.gov/documents/NAP-STATE-PLAN-FIRMADO.pdf#page=28
    - title: "ADSEF, Ponencia ante el Comité de Transición, 30 Oct 2024, p. 6 (one-person figures 2021-2024)"
      href: https://transicion2024.pr.gov/Agencias/127/Ponencias/PONENCIA%20ADSEF%20PDF.pdf#page=6
    - title: "Metro PR, 11 Aug 2024, August 2024 amendment (one-person maximum net income $619 to $633)"
      href: https://www.metro.pr/noticias/2024/08/11/anuncian-aumento-en-los-niveles-de-elegibilidad-del-pan-tras-incremento-en-el-salario-minimo/
  gap: >-
    Only the October 2021 table is published for sizes 2-18. Later changes are
    documented for a one-person household only (ADSEF statement; August 2024
    press release). Sizes 2-18 keep the 2021 values until ADSEF provides the
    current Tabla. Households larger than 18 use the size-18 value.
