# benefit levels since Sep 2024: one person 183 x 1.08 (issuance adjustment); sizes 2+ = 2021 table x 1.307143 (one-person growth) x 1.08; elderly bonus 37 x 1.08
# Expected values from Reglamento 8684 Art. 45-48 and the NAP SPO FY2022
# pp. 26-28 (deductions: earned 50% up to $1,400 from Aug 2024; dependent care
# $225 / $200; student, elderly and medical $100; standard $279 from Aug 2024;
# resources $5,000 / $15,000 with a member aged 60+). Núcleos de servicio
# (pan_units) follow Reglamento 8684's composition rules: a member aged 60+
# who is not the head or spouse may be a separate núcleo (item 10).

- name: "Single parent, children aged 1 and 5, $1,000 a month, pays child care: deductions 500 + 225 + 200 + 279"
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      p:
        age: 30
        employment_income: 12_000
      c1:
        age: 1
      c2:
        age: 5
    households:
      household:
        members: [p, c1, c2]
    pan_units:
      pan_unit:
        members: [p, c1, c2]
        pan_pays_dependent_care: true
        pan_resources: 4_000
  output:
    # (500 + 425 + 279) x 12
    pan_deductions: 14_448
    pan_net_income: 0
    pan_resources_eligible: true
    pan_eligible: true
    # three persons, maximum $368 x 12
    # 368 x 1.307143 x 1.08 x 12
    pan_benefit: 6_234.13
    pan: 6_234.13

- name: Same household with $6,000 in resources is over the $5,000 limit
  period: 2025
  input:
    people:
      p:
        age: 30
        employment_income: 12_000
      c1:
        age: 1
      c2:
        age: 5
    households:
      household:
        members: [p, c1, c2]
    pan_units:
      pan_unit:
        members: [p, c1, c2]
        pan_resources: 6_000
  output:
    pan_resources_eligible: false
    pan_eligible: false
    pan: 0

- name: "Retiree aged 65 with $12,000 of resources keeps the $15,000 limit; medical deduction applies"
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      p:
        age: 65
        social_security: 12_000
    households:
      household:
        members: [p]
    pan_units:
      pan_unit:
        members: [p]
        pan_resources: 12_000
        pan_recurrent_medical_expenses: true
  output:
    pan_resources_eligible: true
    # other income $100 + elderly $100 + medical $100 + standard $279, x 12
    pan_deductions: 6_948
    pan_eligible: true

- name: "A full-time student aged 20 in the household adds $100 a month"
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      p:
        age: 45
        employment_income: 12_000
      s:
        age: 20
        is_full_time_student: true
    households:
      household:
        members: [p, s]
    pan_units:
      pan_unit:
        members: [p, s]
  output:
    # (500 + 100 + 279) x 12
    pan_deductions: 10_548

- name: "Grandmother aged 70 on $9,000 of Social Security living with her daughter's family is her own núcleo"
  period: 2025
  absolute_error_margin: 0.01
  input:
    people:
      d:
        age: 35
        employment_income: 30_000
      c:
        age: 8
      g:
        age: 70
        social_security: 9_000
    households:
      household:
        members: [d, c, g]
    pan_units:
      family:
        members: [d, c]
      grandmother:
        members: [g]
  output:
    # family: 2,500 a month gross earned, 50% deduction capped at 1,400 -> 1,100 - 279 = 821 > 1,179? no: 2,500 - 1,250 - 279 = 971 <= 1,179 (two persons) -> eligible, $257
    # grandmother: 50% of 750 = 375 counted; deductions 100 + 100 + 279 = 479 -> net 0 -> eligible, 183 + 37 bonus
    # family of two: 257 x 1.307143 x 1.08 x 12; grandmother: (183 + 37) x 1.08 x 12
    pan_benefit: [4_353.73, 2_851.2]
    pan_units_receiving: 2
    pan: 7_204.93
