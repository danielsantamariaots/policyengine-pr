# Streamlit Community Cloud puts an app to sleep after a period without
# viewers; the first visitor then waits about a minute while it restarts.
# A plain HTTP request is not a viewer (the front page redirects until a
# browser session starts), so this opens the app in a headless browser for
# a short while every four hours. If Community Cloud stops honouring this,
# move the app to a small paid host (ROADMAP.md, launch checklist).
name: keep-warm

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

jobs:
  visit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install a headless browser
        run: |
          pip install -q playwright==1.49.1
          python -m playwright install --with-deps chromium >/dev/null
      - name: Open the app as a viewer
        run: |
          python - <<'PY'
          import sys
          from playwright.sync_api import sync_playwright

          URL = "https://policyengine-pr.streamlit.app/?view=calc"
          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              page.goto(URL, wait_until="load", timeout=180_000)
              # wait for the Streamlit app (or its wake-up button) to render
              text = ""
              for _ in range(12):
                  page.wait_for_timeout(10_000)
                  # Community Cloud renders the app inside an iframe
                  text = " ".join(
                      f.inner_text("body") for f in page.frames if f.url
                  )
                  if "get this app back up" in text.lower():
                      for f in page.frames:
                          btn = f.get_by_role("button", name="Yes, get this app back up!")
                          if btn.count():
                              btn.first.click()
                  if "Modelo contributivo" in text or "contributiva" in text:
                      print("app rendered")
                      browser.close()
                      sys.exit(0)
              print("app did not render in time:", text[:300])
              browser.close()
              sys.exit(1)
          PY
